[project]
name = "beelzebub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord>=2.3.2",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["C4", "F", "G", "I", "PTH", "RUF", "SIM", "TC", "UP", "W", "PERF"]
ignore = ["F401", "F402", "F403", "F405", "PERF203", "RUF001", "RUF009", "RUF022", "RUF023", "SIM105", "UP034", "UP038", "PTH123"]

[tool.ruff.lint.isort]
split-on-trailing-comma = true
combine-as-imports = true
